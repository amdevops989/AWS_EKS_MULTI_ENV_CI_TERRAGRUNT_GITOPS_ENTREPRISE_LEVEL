apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: istio-gateway-svc-monitor
  namespace: monitoring # Located in monitoring namespace
  labels:
    release: prometheus-stack # Matches Prometheus Operator release selector
spec:
  namespaceSelector:
    matchNames:
      - istio-ingress # Tells Prometheus to look inside istio-ingress for the service
  selector:
    matchLabels:
      prometheus-scrape: istio-gateway
  endpoints:
    - port: metrics
      path: /stats/prometheus
      interval: 15s