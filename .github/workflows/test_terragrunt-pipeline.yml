name: Terragrunt Core Pipeline

on:
  pull_request:
    branches:
      - dev
      - prod
    paths:
      - 'test_infra/**'
  push:
    branches:
      - dev
      - prod
    paths:
      - 'test_infra/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false 

permissions:
  id-token: write      # Required for AWS OIDC
  contents: read       # Required to clone the repo
  pull-requests: write # Required for PR comments

env:
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
  TARGET_ENV: ${{ github.base_ref || github.ref_name }}
  TG_WORKING_DIR: test_infra/live/${{ github.base_ref || github.ref_name }}

jobs:
  # =========================================================
  # 1. PLAN JOB (Runs on Pull Requests - Read-Only Check)
  # =========================================================
  terragrunt-plan:
    name: Terragrunt Plan - ${{ github.base_ref || github.ref_name }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Plugin Cache Dir
        run: mkdir -p ${{ env.TF_PLUGIN_CACHE_DIR }}

      - name: Cache Terraform Plugins
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-tf-cache-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tf-cache-

      - name: Setup OpenTofu/Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: 0.58.3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # Security Scans
      - name: Run tfsec Security Scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.TG_WORKING_DIR }}

      - name: Run Checkov Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ env.TG_WORKING_DIR }}
          framework: terraform

      # Dynamic Change Detection
      - name: Determine Targeted Changes
        id: diff
        run: |
          echo "Processing Pull Request lifecycle tracking..."
          BASE_SHA=$(jq -r .pull_request.base.sha < $GITHUB_EVENT_PATH)
          HEAD_SHA=$(jq -r .pull_request.head.sha < $GITHUB_EVENT_PATH)
          git diff --name-only $BASE_SHA $HEAD_SHA > raw_diff.txt

          if [ ! -s raw_diff.txt ]; then
            echo "tg_args=" >> $GITHUB_OUTPUT
            echo "No changes found across the git tracking delta."
            exit 0
          fi

          if grep -qE "modules/|env.hcl|root.hcl" raw_diff.txt; then
            echo "Core shared files or modules modified. Automatically evaluating all live environment units."
            cd ${{ env.TG_WORKING_DIR }}
            find . -type f -name "terragrunt.hcl" -exec dirname {} \; | sed 's|^\./||' > ../../../filters-file.txt
            cd - > /dev/null
          else
            echo "Isolating localized structural folder changes."
            grep -E "^${{ env.TG_WORKING_DIR }}/" raw_diff.txt | sed "s|^${{ env.TG_WORKING_DIR }}/||" | cut -d'/' -f1 | sort -u > filters-file.txt
          fi

          if [ -s filters-file.txt ]; then
            TG_ARGS=$(awk -v dir="${{ env.TG_WORKING_DIR }}" '{printf "--terragrunt-include-dir=%s/%s ", dir, $0}' filters-file.txt)
            echo "tg_args=$TG_ARGS" >> $GITHUB_OUTPUT
            echo "Filters configured: $TG_ARGS"
          else
            echo "tg_args=" >> $GITHUB_OUTPUT
            echo "No live components matched the changes."
          fi

      # Terragrunt Plan Execution (-no-color flag prevents broken PR formatting)
      - name: Terragrunt Plan
        if: steps.diff.outputs.tg_args != ''
        id: plan
        working-directory: ${{ env.TG_WORKING_DIR }}
        run: |
          set -o pipefail
          terragrunt run-all plan \
            ${{ steps.diff.outputs.tg_args }} \
            --terragrunt-ignore-external-dependencies \
            --terragrunt-non-interactive \
            -- -no-color 2>&1 | tee plan_output.txt
        continue-on-error: true

      # Post or Update Comment on PR with cleaned output
      - name: Post Plan Output to PR
        if: steps.diff.outputs.tg_args != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = '${{ env.TG_WORKING_DIR }}/plan_output.txt';
            
            let planOutput = '';
            try {
              planOutput = fs.readFileSync(path, 'utf8');
            } catch (err) {
              planOutput = 'Error reading plan output file.';
            }

            // Strip ANSI codes explicitly for clean Markdown display
            const cleanOutput = planOutput.replace(/\u001b\[[0-9;]*[a-zA-K]/g, '');

            const maxLen = 60000;
            let finalOutput = cleanOutput;
            if (finalOutput.length > maxLen) {
              finalOutput = finalOutput.substring(finalOutput.length - maxLen) + '\n\n... (Output truncated due to size limits)';
            }

            const outcome = '${{ steps.plan.outcome }}' === 'success' ? '✅ Success' : '❌ Failed';
            const envName = '${{ env.TARGET_ENV }}'.toUpperCase();

            const body = `### 🛠️ Terragrunt Plan Results (\`${envName}\`) - ${outcome}

            <details><summary>Show Terragrunt Plan Output</summary>

            \`\`\`hcl
            ${finalOutput}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }} | Action: \`${{ github.event_name }}\`*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('Terragrunt Plan Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Check Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # =========================================================
  # 2. APPLY JOB (Runs on Merge / Push - REQUIRES APPROVAL)
  # =========================================================
  terragrunt-apply:
    name: Terragrunt Apply - ${{ github.ref_name }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    
    # Environment assignment here enforces manual reviewer approval in GitHub Settings!
    environment: ${{ github.ref_name == 'dev' && 'development' || 'production' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Plugin Cache Dir
        run: mkdir -p ${{ env.TF_PLUGIN_CACHE_DIR }}

      - name: Cache Terraform Plugins
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-tf-cache-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tf-cache-

      - name: Setup OpenTofu/Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: 0.58.3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Determine Targeted Changes
        id: diff
        run: |
          echo "Processing Direct Branch Push lifecycle tracking..."
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            echo "Fresh or standalone push tracking detected. Analyzing history baseline."
            git diff --name-only HEAD~1 HEAD > raw_diff.txt || touch raw_diff.txt
          else
            git diff --name-only ${{ github.event.before }} ${{ github.sha }} > raw_diff.txt || touch raw_diff.txt
          fi

          if [ ! -s raw_diff.txt ]; then
            echo "tg_args=" >> $GITHUB_OUTPUT
            echo "No changes found across the git tracking delta."
            exit 0
          fi

          if grep -qE "modules/|env.hcl|root.hcl" raw_diff.txt; then
            echo "Core shared files or modules modified. Automatically evaluating all live environment units."
            cd ${{ env.TG_WORKING_DIR }}
            find . -type f -name "terragrunt.hcl" -exec dirname {} \; | sed 's|^\./||' > ../../../filters-file.txt
            cd - > /dev/null
          else
            echo "Isolating localized structural folder changes."
            grep -E "^${{ env.TG_WORKING_DIR }}/" raw_diff.txt | sed "s|^${{ env.TG_WORKING_DIR }}/||" | cut -d'/' -f1 | sort -u > filters-file.txt
          fi

          if [ -s filters-file.txt ]; then
            TG_ARGS=$(awk -v dir="${{ env.TG_WORKING_DIR }}" '{printf "--terragrunt-include-dir=%s/%s ", dir, $0}' filters-file.txt)
            echo "tg_args=$TG_ARGS" >> $GITHUB_OUTPUT
            echo "Filters configured: $TG_ARGS"
          else
            echo "tg_args=" >> $GITHUB_OUTPUT
            echo "No live components matched the changes."
          fi

      - name: Terragrunt Apply (Push/Merge)
        if: steps.diff.outputs.tg_args != ''
        working-directory: ${{ env.TG_WORKING_DIR }}
        run: |
          terragrunt run-all apply \
            ${{ steps.diff.outputs.tg_args }} \
            --terragrunt-ignore-external-dependencies \
            --terragrunt-non-interactive \
            -auto-approve

            