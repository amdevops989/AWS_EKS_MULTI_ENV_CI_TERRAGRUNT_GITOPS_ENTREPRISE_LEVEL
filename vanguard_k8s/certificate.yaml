apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vanguardyouth-tls
  namespace: istio-ingress # MUST match the Helm gateway release namespace!
spec:
  secretName: vanguardyouth-tls-cert
  issuerRef:
    name: production-cluster-issuer
    kind: ClusterIssuer
  dnsNames:
    - "vanguardyouth.store"
    - "*.vanguardyouth.store"