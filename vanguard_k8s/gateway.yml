apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: vanguardyouth-shared-gateway
  namespace: istio-ingress
spec:
  selector:
    istio: gateway # Matches default app label generated by istio/gateway Helm chart
  servers:
    # 1. HTTP Port -> Automated HTTPS Redirect
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "vanguardyouth.store"
      tls:
        httpsRedirect: true

    # 2. HTTPS Port -> Terminate TLS with Cert-Manager Secret
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - "vanguardyouth.store"
      tls:
        mode: SIMPLE
        credentialName: vanguardyouth-tls-cert # K8s secret generated in istio-ingress