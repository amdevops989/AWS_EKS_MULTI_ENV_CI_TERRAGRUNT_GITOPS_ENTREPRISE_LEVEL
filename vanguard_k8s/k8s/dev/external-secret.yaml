apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rds-backend-secret
  namespace: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: backend-secret # 🌟 K8s Secret created in namespace 'dev'
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: "vanguardyouth/dev/rds-cred" # Predictable path in Secrets Manager
        property: password
    - secretKey: POSTGRES_USER
      remoteRef:
        key: "vanguardyouth/dev/rds-cred"
        property: username