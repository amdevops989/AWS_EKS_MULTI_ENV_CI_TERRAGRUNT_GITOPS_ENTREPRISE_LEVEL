apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: dev
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
data:
  POSTGRES_USER: "dbadmin"
  POSTGRES_DB: "vanguardyouth"
  DB_HOST: "db.internal.vanguardyouth.store"
  DB_PORT: "5432"
  PGSSLMODE: "no-verify"

