# ==========================================================
# 3. BACKEND CANARY ROLLOUT
# ==========================================================
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: backend
  namespace: dev
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        devopsteam: ironcore-devops
      annotations:
        proxy.istio.io/config: |
          holdApplicationUntilProxyStarts: true
        # 🌟 BYPASS ISTIO SIDECAR FOR DIRECT RDS COMMUNICATION:
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432"
    spec:
      containers:
        - name: backend-ui
          image: "devopsflow999/crud-backend:v1.0.17" # Update image repository and tag as needed
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: POSTGRES_USER
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: POSTGRES_DB
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: POSTGRES_PASSWORD
  strategy:
    canary:
      stableService: backend-stable
      canaryService: backend-canary
      trafficRouting:
        istio:
          virtualService:
            name: backend-vservice
            routes:
              - backend-route
      steps:
        - setWeight: 20
        - pause: { duration: 3m }
        # - analysis:
        #     templates:
        #       - templateName: backend-success-rate
        - setWeight: 50
        - pause: { duration: 2m }

---
# ==========================================================
# 4. KUBERNETES SERVICES (CANARY & STABLE)
# ==========================================================
apiVersion: v1
kind: Service
metadata:
  name: backend-canary
  namespace: dev
spec:
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: backend

---
apiVersion: v1
kind: Service
metadata:
  name: backend-stable
  namespace: dev
spec:
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: backend

---
# ==========================================================
# 5. ISTIO VIRTUAL SERVICE
# ==========================================================
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: backend-vservice
  namespace: dev
spec:
  hosts:
    # 🌟 1. Updated to match your DEV domain setup
    - "dev.vanguardyouth.store"
    - "backend-stable"
    - "backend-canary"
  gateways:
    # 🌟 2. Binds to your DEV Istio Gateway
    - istio-ingress/vanguardyouth-dev-shared-gateway
    - mesh # Maintains internal pod-to-pod routing
  http:
    - name: backend-route
      match:
        - uri:
            prefix: /api/items
      rewrite:
        uri: /items
      route:
        - destination:
            host: backend-stable
            port:
              number: 3000
          weight: 100
        - destination:
            host: backend-canary
            port:
              number: 3000
          weight: 0